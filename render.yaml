services:
  - type: web
    name: netra-ai
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,http://*.onrender.com,https://*.railway.app,https://*.up.railway.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: VISION_BACKEND
        value: "auto"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_AUDIO_MODEL
        value: "gemini-2.0-flash"
      - key: GEMINI_API_KEY
        sync: false

