# ==============================================================================
# Nginx Configuration for Netra AI
# Handles HTTP, WebSockets (/ws/), and static/media serving
# ==============================================================================

upstream daphne_backend {
    server web:8000;
}

server {
    listen 80;
    server_name localhost _;

    client_max_body_size 10M;

    # Gzip compression for text, scripts, stylesheets, and json
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets served directly by Nginx with aggressive caching
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # User-uploaded media (feedback frames, model weights)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # PWA Service Worker & Manifest (serve with immediate update checks)
    location = /sw.js {
        alias /app/staticfiles/sw.js;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        alias /app/staticfiles/manifest.webmanifest;
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=86400";
    }

    # Real-time WebSockets endpoint (/ws/) for live camera inference
    location /ws/ {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSockets alive during active walking sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Standard HTTP routing (Django templates & REST API)
    location / {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
    }
}
